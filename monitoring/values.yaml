# Valeurs Helm pour kube-prometheus-stack, allégées pour une VM de 4 Go / Minikube 2,5 Go
alertmanager:
  enabled: false            # non nécessaire pour la démo, économise de la RAM

grafana:
  adminUser: admin
  adminPassword: admin-pfe  # à changer après la première connexion
  service:
    type: NodePort
    nodePort: 30300
  # Alertmanager est désactivé : ne pas créer sa source de données (sinon source "en erreur")
  sidecar:
    datasources:
      alertmanager:
        enabled: false
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits:   { memory: 512Mi }
  # Premier démarrage lent sur une petite VM (migrations de la base interne de Grafana)
  livenessProbe:
    httpGet: { path: /api/health, port: 3000 }
    initialDelaySeconds: 180
    timeoutSeconds: 30
    failureThreshold: 10
  readinessProbe:
    httpGet: { path: /api/health, port: 3000 }
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  # Pas de téléchargement de plugins optionnels à chaque démarrage (connexion lente)
  grafana.ini:
    plugins:
      preinstall_disabled: true
    analytics:
      check_for_updates: false
      check_for_plugin_updates: false
      reporting_enabled: false

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 2d
    scrapeInterval: 30s
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { memory: 768Mi }
    # Permet à Prometheus de découvrir les ServiceMonitor de tous les namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 192Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits:   { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits:   { memory: 64Mi }

# Composants du control-plane non joignables dans Minikube -> évite des alertes "down" inutiles
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
