# Application Django : 2 replicas (haute disponibilité + répartition de charge)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: formation
  labels: { app: web }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate     # mise à jour sans interruption de service
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      # 1) Attend que PostgreSQL soit prêt, 2) applique les migrations, puis lance l'app
      initContainers:
        - name: wait-for-db
          image: postgres:15
          command: ["sh", "-c", "until pg_isready -h $POSTGRES_HOST -p $POSTGRES_PORT; do echo 'attente de PostgreSQL...'; sleep 2; done"]
          envFrom:
            - configMapRef: { name: formation-config }
        - name: migrate
          image: chaimatouati/gestion-formation:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef: { name: formation-config }
            - secretRef:    { name: formation-secret }
      containers:
        - name: web
          image: chaimatouati/gestion-formation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: formation-config }
            - secretRef:    { name: formation-secret }
          volumeMounts:
            - name: media
              mountPath: /media     # settings.py : os.path.join(BASE_DIR,'/media/') => /media
          readinessProbe:          # le pod ne reçoit du trafic que lorsqu'il répond
            httpGet: { path: /admin/login/, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:           # Kubernetes redémarre le conteneur s'il ne répond plus
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 384Mi }
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
---
# Service NodePort : expose l'application à l'extérieur du cluster sur le port 30080
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: formation
  labels: { app: web }
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
