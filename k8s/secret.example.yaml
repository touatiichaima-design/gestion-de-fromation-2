# Modèle de Secret (versionné dans Git, SANS vraies valeurs).
# Le vrai Secret est généré automatiquement par deploy.sh à partir du fichier .env de la VM,
# ainsi aucun mot de passe n'est jamais commité dans GitHub.
apiVersion: v1
kind: Secret
metadata:
  name: formation-secret
  namespace: formation
type: Opaque
stringData:
  SECRET_KEY: "changeme"
  POSTGRES_USER: "formation_user"
  POSTGRES_PASSWORD: "changeme"
