name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write    # nécessaire pour publier le rapport Trivy dans l'onglet "Security"

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/gestion-formation

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      # ---------- 1. Récupération du code + tests ----------
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérification Django
        run: python manage.py check || true

      # ---------- 2. Build de l'image (locale, pas encore poussée) ----------
      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: gestion-formation:scan

      # ---------- 3. Sécurité : scan Trivy (DevSecOps) ----------
      - name: Scan Trivy - rapport lisible dans les logs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (épinglé par SHA)
        with:
          image-ref: gestion-formation:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'          # mettre '1' pour bloquer le pipeline en cas de faille

      - name: Scan Trivy - rapport SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (épinglé par SHA)
        with:
          image-ref: gestion-formation:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '0'

      - name: Publier les résultats dans GitHub Security
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Archiver le rapport Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif

      # ---------- 4. Publication sur Docker Hub (uniquement sur main) ----------
      - name: Connexion Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push de l'image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
