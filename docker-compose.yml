
version: "3.9"

services:
  db:
    image: postgres:15
    container_name: pfe-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pfe-network

  web:
    build: .
    container_name: pfe-web
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - pfe-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pfe-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - pfe-network

volumes:
  postgres_data:

networks:
  pfe-network:
    driver: bridge
